aid: goatcounter
name: GoatCounter
description: >-
  GoatCounter is open-source, privacy-friendly web analytics from Martin Tournoij, offered both as a free
  donation-supported hosted service at goatcounter.com and as a self-hostable Go binary backed by SQLite or
  PostgreSQL. It tracks pageviews without cookies or persistent personal identifiers. The unversioned JSON API,
  prefixed /api/v0 and served from each account's own subdomain, covers counting pageviews and events from a
  backend, reading dashboard statistics (totals, per-path hits, referrals, browser/system/location breakdowns),
  running asynchronous CSV and JSON exports with an incremental hit-ID cursor, and managing sites and users.
  Authentication is a per-site API key sent as an HTTP bearer token, and the provider publishes its own
  OpenAPI 2.0 contract at https://www.goatcounter.com/api.json.
