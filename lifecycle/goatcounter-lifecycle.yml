description: >-
  Versioning, stability and operational-transparency posture for the GoatCounter JSON API.
  GoatCounter is a single-maintainer open-source project with a dated CHANGELOG, tagged releases,
  and a live machine-readable status endpoint, but no formal deprecation policy, no Sunset/Deprecation
  header support, and no SLA.
versioning:
  scheme: uri-path
  current: v0
  versioned: false
  path_prefix: /api/v0
  docs: https://www.goatcounter.com/help/api
  statement: >-
    Quoted from the API help page: "The API is currently unversioned and prefixed with /api/v0;
    breaking changes will be avoided and are not expected but may occur. I'll be sure to send ample
    notification of this to everyone who has generated an API key."
  note: >-
    A stability commitment plus a promise to notify key holders. It is not a published deprecation
    policy — there is no notice period, no sunset window and no deprecation page — so no Deprecation
    pointer is emitted for this provider.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
