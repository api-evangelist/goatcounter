description: >-
  GoatCounter ships no conventional per-language API client SDK. The first-party
  distributions are the Go module / self-hosted server binary (which also carries the
  CLI), the official Docker image, and the browser tracking script count.js served
  from the provider's own CDN host gc.zgo.at. Every goatcounter package on npm is a
  third-party framework plugin (Docusaurus, Next.js, Gatsby, VuePress) authored by
  community maintainers, not by GoatCounter, so none is marked official.
